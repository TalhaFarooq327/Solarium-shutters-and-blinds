[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "api"

# Redirect /api/* requests to Netlify Functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — send all other routes to index.html (React hash router)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
